apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# CI rewrites newTag with the commit SHA; Argo CD then syncs this overlay (GitOps).
images:
  - name: taskflow
    newName: ghcr.io/OWNER_PLACEHOLDER/taskflow
    newTag: latest
patches:
  - target: {kind: Rollout, name: taskflow}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: HorizontalPodAutoscaler, name: taskflow}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
