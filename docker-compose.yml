# Local developer stack: app + Prometheus + Grafana.
# Usage: docker compose up --build   (app :8080, Prometheus :9090, Grafana :3000)
services:
  app:
    build: .
    image: taskflow:local
    ports: ["8080:8080"]
    environment:
      APP_VERSION: local
      LOG_LEVEL: INFO
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
