name: Rollback

# Recoverability: point prod back at any previously published image tag.
# Argo CD syncs the change and Argo Rollouts performs it as a controlled canary.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short commit SHA of a previously published image (e.g. a1b2c3d)"
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repoint prod overlay
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow"
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/YOUR_GH_USER/taskflow=${IMAGE}:${{ inputs.sha }}
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "ci: rollback prod to ${{ inputs.sha }} [skip ci]"
          git push
