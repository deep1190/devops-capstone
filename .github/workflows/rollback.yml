name: Rollback

# Recoverability: point prod back at any previously published image tag.
# Run it from the Actions tab -> Rollback -> Run workflow -> enter a short commit SHA.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short commit SHA of a previously published image (e.g. a1b2c3d)"
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin
      - name: Repoint prod overlay
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cd k8s/overlays/prod
          kustomize edit set image taskflow=ghcr.io/${OWNER}/taskflow:${{ inputs.sha }}
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "ci: rollback prod to ${{ inputs.sha }} [skip ci]"
          git pull --rebase origin main
          git push
