name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 1. code
  test:
    name: Lint, test, SAST, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Unit tests with coverage gate
        working-directory: app
        run: python -m pytest -q --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - name: SAST (bandit)
        run: bandit -r app -x app/tests -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r app/requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage.xml

  # -------------------------------------------------- 2. secrets + IaC checks
  config-security:
    name: Secrets scan, IaC and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Dashboard copy in sync
        run: diff monitoring/dashboards/taskflow.json k8s/base/taskflow-dashboard.json
      - name: Render kustomize overlays
        run: |
          kustomize build k8s/overlays/dev  > /tmp/dev.yaml
          kustomize build k8s/overlays/prod > /tmp/prod.yaml
      - name: Validate manifests (kubeconform + CRD schemas)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/dev.yaml /tmp/prod.yaml
      - name: Prometheus rules syntax (promtool)
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar xz
          ./prometheus-2.55.1.linux-amd64/promtool check rules monitoring/alert-rules.yml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: IaC misconfiguration scan (trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: terraform/.terraform

  # ------------------------------------------- 3. build, scan, sign, publish
  build:
    name: Build, scan, publish image
    needs: [test, config-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability scan (trivy) - fails on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Sign image (cosign keyless)
        if: github.event_name == 'push'
        run: cosign sign --yes ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ------------------------------------------ 4. GitOps: promote by git commit
  deploy:
    name: Update prod manifest (Argo CD syncs it)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point prod overlay at the new image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/YOUR_GH_USER/taskflow=${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha }}
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "ci: deploy ${{ needs.build.outputs.sha }} to prod [skip ci]"
          git push
