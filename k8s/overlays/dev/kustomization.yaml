apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/YOUR_GH_USER/taskflow
    newTag: latest
patches:
  - target: {kind: Rollout, name: taskflow}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: HorizontalPodAutoscaler, name: taskflow}
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
