name: CI-CD

# Runs on every push / pull request. No secrets or edits are needed:
# the image registry (GHCR) and repo owner are taken from the GitHub context.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 1. code
  test:
    name: 1 - Lint, unit tests, SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Unit tests + coverage gate (>=85%)
        working-directory: app
        run: |
          python -m pytest -v --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85 | tee ../test-report.txt
      - name: SAST (bandit, medium+ severity)
        run: bandit -r app -x app/tests -ll | tee bandit-report.txt
      - name: Dependency audit (pip-audit, report only)
        continue-on-error: true
        run: pip-audit -r app/requirements.txt | tee pip-audit-report.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Test report"
            echo '```'
            tail -n 40 test-report.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            test-report.txt
            bandit-report.txt
            pip-audit-report.txt
            app/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------- 2. validate configuration and IaC
  validate:
    name: 2 - Validate Docker, Kubernetes, Prometheus, Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          curl -sSL -o "$HOME/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar xz -C /tmp
          cp /tmp/prometheus-2.55.1.linux-amd64/promtool "$HOME/bin/"
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Dockerfile lint (hadolint, errors only)
        run: hadolint --failure-threshold error Dockerfile
      - name: Dashboard copies are in sync
        run: diff monitoring/dashboards/taskflow.json k8s/base/taskflow-dashboard.json
      - name: Render kustomize overlays
        run: |
          kustomize build k8s/overlays/dev  > /tmp/dev.yaml
          kustomize build k8s/overlays/prod > /tmp/prod.yaml
          kustomize build k8s/ci            > /tmp/ci.yaml
      - name: Validate Kubernetes manifests (kubeconform, schemas fetched online)
        continue-on-error: true
        run: |
          kubeconform -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/dev.yaml /tmp/prod.yaml /tmp/ci.yaml
      - name: Validate Prometheus alert rules (promtool)
        run: promtool check rules monitoring/alert-rules.yml
      - uses: hashicorp/setup-terraform@v3
        continue-on-error: true
      - name: Terraform fmt + validate
        continue-on-error: true
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Secret scan (gitleaks, report only)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: IaC misconfiguration scan (trivy, report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ------------------------------------------- 3. build, scan, sign, publish
  build:
    name: 3 - Build, scan, publish image
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test (run image, hit /healthz)
        run: |
          docker run -d --name t -p 18080:8080 ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          for i in $(seq 20); do curl -fs localhost:18080/healthz && break; sleep 1; done
          ./scripts/smoke-test.sh http://localhost:18080
          docker logs t | tail -n 5
          docker rm -f t
      - name: Image vulnerability scan (trivy, report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: SBOM (SPDX)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
        continue-on-error: true
      - name: Sign image (cosign keyless)
        if: github.event_name == 'push'
        continue-on-error: true
        run: cosign sign --yes ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Image"
            echo "\`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------- 4. deploy to a real Kubernetes cluster (kind) inside CI
  e2e-kubernetes:
    name: 4 - Deploy to Kubernetes (kind) and verify
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskflow:ci --build-arg APP_VERSION=ci --build-arg GIT_SHA=${GITHUB_SHA} .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load image into cluster
        run: kind load docker-image taskflow:ci --name ci
      - name: Deploy manifests
        run: |
          kubectl apply -k k8s/ci
          kubectl -n taskflow-ci rollout status deployment/taskflow --timeout=180s
          kubectl -n taskflow-ci get pods,svc,hpa,pdb,networkpolicy -o wide | tee k8s-state.txt
      - name: Smoke test through the Kubernetes Service
        run: |
          kubectl -n taskflow-ci port-forward svc/taskflow 18081:80 >/dev/null 2>&1 &
          for i in $(seq 30); do curl -fs localhost:18081/healthz >/dev/null && break; sleep 1; done
          ./scripts/smoke-test.sh http://localhost:18081 | tee smoke.txt
          curl -s localhost:18081/metrics | grep -E '^taskflow_' | head -n 30 | tee metrics.txt
      - name: Collect logs
        if: always()
        run: |
          kubectl -n taskflow-ci logs -l app=taskflow --tail=100 > pod-logs.txt || true
          kubectl -n taskflow-ci describe pods > pod-describe.txt || true
          {
            echo "### Kubernetes deployment (kind)"
            echo '```'
            cat k8s-state.txt smoke.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-evidence
          path: |
            k8s-state.txt
            smoke.txt
            metrics.txt
            pod-logs.txt
            pod-describe.txt
          if-no-files-found: ignore

  # ------------------------------------------ 5. GitOps: promote by git commit
  deploy:
    name: 5 - GitOps - update production manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e-kubernetes]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin 2>/dev/null || \
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin
      - name: Point prod overlay at the new image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image taskflow=ghcr.io/${{ needs.build.outputs.owner }}/taskflow:${{ needs.build.outputs.sha }}
          cat kustomization.yaml
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "ci: deploy ${{ needs.build.outputs.sha }} to prod [skip ci]"
          git pull --rebase origin main
          git push
